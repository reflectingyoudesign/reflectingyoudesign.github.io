<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflecting You Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f3;
    --surface: #ffffff;
    --ink: #16181d;
    --ink-muted: #5b6169;
    --ink-faint: #8b9198;
    --border: #dfe2e6;
    --accent: #3a5a6b;
    --accent-soft: #e4edef;
    --accent-ink: #1f3844;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a;
      --surface: #1b1f26;
      --ink: #eceff3;
      --ink-muted: #9aa3ad;
      --ink-faint: #6b727b;
      --border: #2a2f38;
      --accent: #8fc0d2;
      --accent-soft: #1e2b30;
      --accent-ink: #cfe9f0;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    color: var(--ink);
    font-weight: 500;
    text-wrap: balance;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .brandmark {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 18px;
  }
  .brandmark .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .brandmark span {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  p.lede {
    color: var(--ink-muted);
    font-size: 15.5px;
    margin: 0 0 32px;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .links a {
    color: var(--accent-ink);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 18px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .links a:hover { text-decoration: underline; }
  .links a.ghost {
    background: transparent;
    color: var(--ink-muted);
  }
  footer {
    margin-top: 40px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="card">
  <div class="brandmark"><span class="dot"></span><span>Reflecting You Design</span></div>
  <h1>Minimalist art &amp; gifts, made to order</h1>
  <p class="lede">We design and print art on demand, sold through our Etsy shop. This page also hosts the privacy policy for our internal Pinterest API integration.</p>
  <div class="links">
    <a href="https://www.etsy.com/shop/ReflectingYouDesign">Visit our Etsy shop</a>
    <a href="/privacy/" class="ghost">Privacy Policy</a>
  </div>
  <footer>reflectingyoudesign.github.io</footer>
</div>
</body>
</html>
